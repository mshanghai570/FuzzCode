name: FuzzCode
options:
  bundleIdPrefix: com.fuzzcode
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  FuzzCodeCore:
    type: framework
    platform: iOS
    sources: [Sources/FuzzCodeCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FuzzCode:
    type: application
    platform: iOS
    sources: [Sources/FuzzCodeUI]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FuzzCode
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Connect to your development machine and local model providers.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: FuzzCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fuzzcode.app
  FuzzCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/FuzzCodeTests]
    dependencies:
      - target: FuzzCodeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FuzzCode:
    build:
      targets:
        FuzzCode: all
        FuzzCodeTests: [test]
    test:
      targets: [FuzzCodeTests]
  FuzzCodeCoreTests:
    build:
      targets:
        FuzzCodeCore: all
        FuzzCodeTests: [test]
    test:
      targets: [FuzzCodeTests]
